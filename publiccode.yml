publiccodeYmlVersion: "0"

name: nglue
url: "https://github.com/SUNET/nglue"
platforms:
  - linux

categories:
  - it-service-management

developmentStatus: stable

softwareType: "standalone/desktop"

description:
  en:
    shortDescription: >
      This is a commandline tool to upload data
      to ticketing system.

    longDescription: >
      Glue code that forwards Nagios service and host state notifications
      to a web API. It is invoked by Nagios as a notification command and
      posts the alert details (status, hostname, description, attempt
      number) to a configured HTTP endpoint as JSON, so the events can be
      ingested by an external ticketing system.
    features:
      - JSON
      - HTTP POST request

legal:
